[project]
name = "modelswitch"
version = "1.0.0"
description = "Hardware-adaptive local multi-model LLM inference gateway for llama.cpp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ModelSwitch Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psutil>=6.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "openai>=1.50",
]
cloud = []

[project.scripts]
modelswitch = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
markers = [
  "integration: tests requiring a live llama.cpp backend/model",
  "security: security regression tests",
  "slow: long-running benchmark or soak tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
